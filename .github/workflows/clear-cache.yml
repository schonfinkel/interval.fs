name: "[CI] Clear cache"

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["[Nix] Build & Tests"]
    types: [completed]
    branches: [master]
  pull_request:
    types:
      - closed

permissions:
  actions: write
  contents: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # Sweeps every merged PR rather than only the one that just landed, so a master run that failed
  # and later passed on a re-run still gets its PR's caches removed.
  merged-pr-cleanup:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches of merged PRs whose merge commit passed on master
        run: |
          caches="$(gh cache list --limit 1000 --json id,ref \
            --jq '.[] | select(.ref | test("^refs/pull/[0-9]+/merge$")) | "\(.ref) \(.id)"')"

          for ref in $(printf '%s\n' "$caches" | cut -d' ' -f1 | sort -u); do
            number="${ref#refs/pull/}"
            number="${number%/merge}"

            sha="$(gh pr view "$number" --json mergedAt,mergeCommit \
              --jq 'select(.mergedAt != null) | .mergeCommit.oid')"
            if [[ -z "$sha" ]]; then
              continue
            fi

            green="$(gh api --method GET \
              "repos/${GH_REPO}/actions/workflows/build.yml/runs" \
              -f event=push \
              -f head_sha="$sha" \
              -f status=success \
              -f per_page=1 \
              --jq '.total_count > 0')"
            if [[ "$green" != "true" ]]; then
              echo "Keeping caches of PR #$number: $sha has no successful master run yet"
              continue
            fi

            echo "Deleting caches of PR #$number"
            printf '%s\n' "$caches" | awk -v ref="$ref" '$1 == ref { print $2 }' |
              while IFS= read -r id; do
                gh cache delete "$id"
              done
          done

  # No master run follows a PR closed without merging, so its caches can go immediately.
  closed-pr-cleanup:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches of the closed PR
        env:
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh cache list --ref "$REF" --limit 1000 --json id --jq '.[].id' |
            while IFS= read -r id; do
              gh cache delete "$id"
            done

  manual-cleanup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Clear every cache
        run: gh cache delete --all
