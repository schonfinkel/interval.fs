name: Release

# Woken by a green build of master, not by the tag push itself: a tag sits unreleased until the
# next successful "[Nix] Build & Tests" run, or a manual workflow_dispatch, checks for it.
# Discovery verifies that the tagged commit itself has a successful build.yml push run before it
# can proceed. If build.yml is renamed, update both references below.
on:
  workflow_run:
    workflows: ["[Nix] Build & Tests"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# Strictly serial: a second green build arriving while a release is in flight waits its turn
# instead of racing it, so the same pending tag cannot be published twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Finds release-shaped tags on master with no GitHub Release whose exact commit already passed
  # build.yml. Tags below 2.0.0 predate this pipeline and are ignored.
  pending:
    name: Discover unreleased tags
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tags: ${{ steps.discover.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Discover unreleased tags
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags="$(
            git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=creatordate |
            while IFS= read -r tag; do
              if ! printf '2.0.0\n%s\n' "${tag#v}" | sort -V -C \
                 || ! git merge-base --is-ancestor "$tag" origin/master \
                 || gh release view "$tag" >/dev/null 2>&1; then
                continue
              fi

              sha="$(git rev-list -n 1 "$tag")"
              green="$(
                gh api --method GET \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs" \
                  -f branch=master \
                  -f event=push \
                  -f head_sha="$sha" \
                  -f status=success \
                  -f per_page=1 \
                  --jq '.total_count > 0'
              )"

              if [[ "$green" == "true" ]]; then
                printf '%s\n' "$tag"
              else
                echo "::warning title=Tag is not releasable::$tag has no successful build.yml push run for $sha" >&2
              fi
            done | jq -R . | jq -sc .
          )"
          # Compact JSON on purpose: $GITHUB_OUTPUT accepts single-line key=value pairs only.
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Unreleased tags: $tags"

  # CI already built and tested this exact commit. This job only creates the NuGet artifacts;
  # build.yml owns documentation and Pages deployment.
  prepare:
    name: Prepare ${{ matrix.tag }}
    needs: pending
    if: needs.pending.result == 'success' && needs.pending.outputs.tags != '[]'
    strategy:
      # A bad tag must not cancel a good tag's preparation.
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.pending.outputs.tags) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.tag }}
          token: ${{ github.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # keep-env-derivations/keep-outputs protect the ci shell's flake inputs
          # and shell derivation from the pre-save garbage collection below.
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Check the tag matches the declared version
        run: nix develop .#ci --impure -c make check-version TAG="$TAG"
        env:
          TAG: ${{ matrix.tag }}

      # VERSION is passed explicitly so the artifact is named after the tag being prepared.
      - name: Pack release
        run: nix develop .#ci --impure -c make pack VERSION="${TAG#v}"
        env:
          TAG: ${{ matrix.tag }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.tag }}
          path: out/packages
          if-no-files-found: error

  # Publishes only after every pending tag is prepared. NuGet publishing uses trusted publishing:
  # the OIDC token is exchanged for a one-hour API key, so no long-lived key exists to leak. The
  # GitHub Release is created last, so release notes only ever point at packages that are live.
  publish:
    name: Publish ${{ matrix.tag }}
    needs: [pending, prepare]
    if: >-
      needs.pending.result == 'success' &&
      needs.prepare.result == 'success' &&
      needs.pending.outputs.tags != '[]'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.pending.outputs.tags) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write  # gh release create
      id-token: write  # OIDC token issuance for NuGet trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download packed packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.tag }}
          path: out/packages

      # The temporary key lives one hour and each login consumes the OIDC token, so the login
      # happens immediately before the push it exists for.
      - name: NuGet login (OIDC to temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish the package to nuget.org
        run: make push VERSION="${TAG#v}"
        env:
          TAG: ${{ matrix.tag }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: Create GitHub Release
        run: gh release create "$TAG" --generate-notes
        env:
          TAG: ${{ matrix.tag }}
          GITHUB_TOKEN: ${{ github.token }}
